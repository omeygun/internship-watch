name: watch
on:
  schedule:
    - cron: "3,13,23,33,43,53 * * * *"   # backup only: GitHub drops many scheduled runs, esp. at :00
  workflow_dispatch:                     # primary: an external cron (cron-job.org) POSTs this every 10 min
permissions:
  contents: write
concurrency:
  group: watch
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
      - run: python3 watch_cloud.py
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      - name: Save seen.json
        run: |
          git config user.name "internship-watch"
          git config user.email "internship-watch@users.noreply.github.com"
          git add seen.json
          git diff --cached --quiet || (git commit -q -m "update seen jobs" && git pull -q --rebase && git push -q)
