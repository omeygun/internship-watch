name: watch
on:
  schedule:
    - cron: "*/10 * * * *"   # GitHub may delay scheduled runs by a few minutes under load
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: watch
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: python3 watch_cloud.py
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      - name: Save seen.json
        run: |
          git config user.name "internship-watch"
          git config user.email "internship-watch@users.noreply.github.com"
          git add seen.json
          git diff --cached --quiet || (git commit -q -m "update seen jobs" && git push -q)
